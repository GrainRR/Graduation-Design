{% extends 'club/base.html' %}
{% comment %}
密码重置页。
视图：reset_password_view。
关键上下文：form=ResetPasswordForm；账号字段会匹配学号、手机号或邮箱。
{% endcomment %}
{% block page_back %}
<p class="page-back"><a class="btn" href="{% url 'club:login' %}">返回登录</a></p>
{% endblock %}
{% block content %}
<h2>重置密码</h2>
<div class="auth-wrap">
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">重置</button></form>
</div>
{% endblock %}
