{% extends 'club/base.html' %}
{% block content %}
<h2>我的成立社团申请</h2>
<table><tr><th>社团名称</th><th>状态</th><th>审核意见</th><th>提交时间</th></tr>
{% for a in apps %}
<tr><td>{{ a.club_name }}</td><td>{{ a.get_status_display }}</td><td>{{ a.review_comment|default:'-' }}</td><td>{{ a.created_at }}</td></tr>
{% empty %}
<tr><td colspan="4">暂无记录</td></tr>
{% endfor %}
</table>
{% endblock %}
