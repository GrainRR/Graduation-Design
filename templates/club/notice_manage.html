{% extends 'club/base.html' %}
{% block content %}
<h2>公告管理</h2>
<p><a href="{% url 'club:notice_new' %}">新建公告</a></p>
<table><tr><th>标题</th><th>状态</th><th>操作</th></tr>
{% for n in notices %}
<tr><td>{{ n.title }}</td><td>{{ n.get_status_display }}</td><td><a href="{% url 'club:notice_edit' n.id %}">编辑</a> <a href="{% url 'club:notice_action' n.id 'publish' %}">发布</a> <a href="{% url 'club:notice_action' n.id 'recall' %}">撤回</a></td></tr>
{% endfor %}
</table>
{% endblock %}
