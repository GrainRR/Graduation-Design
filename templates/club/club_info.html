{% extends 'club/base.html' %}
{% comment %}
旧版社团信息展示模板。
当前社团详情主要走 my_club_detail / club_info_manage，本模板保留作简单展示页参考。
{% endcomment %}
{% block content %}
<h2>{{ info.name }}</h2>
<p><b>简介：</b>{{ info.intro }}</p>
<p><b>章程：</b>{{ info.charter }}</p>
<p><b>联系方式：</b>{{ info.contact }}</p>
<p><b>负责人：</b>{{ info.principal }}</p>
{% endblock %}
