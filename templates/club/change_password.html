{% extends 'club/base.html' %}
{% comment %}
登录后修改密码页。
视图：change_password_view。
关键上下文：form=SimplePasswordChangeForm，保存后会刷新 session，避免用户被强制退出。
{% endcomment %}
{% block page_back %}
<p class="page-back"><a class="btn" href="{% url 'club:profile' %}">返回个人资料</a></p>
{% endblock %}
{% block content %}
<h2>修改密码</h2>
<div class="auth-wrap">
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">保存</button></form>
</div>
{% endblock %}
