{% extends 'club/base.html' %}
{% comment %}
登录页。
视图：login_view。
关键上下文：form=LoginForm；提交后交给 MultiAccountBackend 支持学号/手机号/邮箱/用户名登录。
{% endcomment %}
{% block content %}
<h2>登录</h2>
<div class="auth-wrap">
    <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">登录</button></form>
    <p><a class="btn" href="{% url 'club:reset_password' %}">忘记密码</a></p>
</div>
{% endblock %}
